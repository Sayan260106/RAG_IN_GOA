[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hhgoa-voice-rag"
version = "0.1.0"
description = "Voice-activated RAG system for Goa knowledge retrieval"
authors = [{ name = "RAG in Goa Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.6.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
