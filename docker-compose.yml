version: '3.8'

services:
  rag-backend:
    build: .
    container_name: hhgoa-voice-rag-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ./data:/app/data
      - ./indexes:/app/indexes
      - ./configs:/app/configs
    restart: unless-stopped
