app:
  name: "hhgoa-voice-rag"
  version: "0.1.0"
  env: "production"

speech:
  provider: "sarvam"
  model: "saaras:v1"
  language_code: "en-IN"
  sample_rate: 16000

llm:
  provider: "groq"
  model: "openai/gpt-oss-120b"
  temperature: 0.2
  max_output_tokens: 512

dataset:
  provider: "huggingface"
  name: "ai4bharat/MSMARCO-XI"
  split: "train"
  streaming: true
  max_samples: 500

latency_budget_ms: 250
